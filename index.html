<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candy Blast</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
user-select:none;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#dff6ff;
touch-action:none;
}

#game{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#top{
position:fixed;
top:0;
left:50%;
transform:translateX(-50%);
width:min(500px,96%);
padding:8px 12px;
border-radius:0 0 22px 22px;
background:linear-gradient(135deg,#ffd7ec,#ff9ac8);
box-shadow:0 5px 18px #0003;
z-index:5;

.title{

font-size:20px;

.stats{

justify-content:space-between;
color:#7d174f;
font-size:14px;
font-weight:900;
margin:2px 0;
}

#mode{
position:fixed;
left:50%;
top:115px;
transform:translateX(-50%);
z-index:6;
color:#a01861;
font-weight:1000;
background:#fff9;
padding:6px 14px;
border-radius:20px;
display:none;
}

#message{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%) scale(.5);
opacity:0;
z-index:100;
color:white;
font-size:30px;
font-weight:1000;
text-shadow:0 4px 10px #6d1650;
pointer-events:none;
white-space:nowrap;
transition:.18s;
}

#message.show{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

/* BOTTOM MENU */

#bottom{
position:fixed;
left:0;
bottom:0;
width:100%;
height:60px;
z-index:10;
pointer-events:none;
}

#menuViewport{
position:absolute;
left:45px;
right:45px;
top:0;
height:55px;
overflow:hidden;
pointer-events:auto;
}

#menu{
height:55px;
display:flex;
align-items:center;
justify-content:flex-start;
gap:7px;
white-space:nowrap;
transition:transform .2s ease;
width:max-content;
}

button{
border:0;
border-radius:15px;
padding:9px 11px;
background:linear-gradient(#fff,#ffd8eb);
color:#95155a;
font-weight:900;
box-shadow:0 4px 10px #0003;
}

button:active{
transform:scale(.96);
}

button:disabled{
opacity:.5;
}

.move{
position:absolute;
top:8px;
width:36px;
height:36px;
padding:0;
font-size:18px;
pointer-events:auto;
z-index:20;
}

#leftBtn{left:5px}
#rightBtn{right:5px}

/* PANEL */

#panel{
position:fixed;
left:50%;
top:50%;
width:min(400px,92%);
max-height:80%;
overflow:auto;
padding:15px;
background:#fff;
border-radius:24px;
box-shadow:0 12px 45px #0006;
transform:translate(-50%,-50%) scale(.85);
opacity:0;
pointer-events:none;
z-index:50;
transition:.2s;
}

#panel.open{
opacity:1;
pointer-events:auto;
transform:translate(-50%,-50%) scale(1);
}

.panelTitle{
text-align:center;
font-size:24px;
font-weight:1000;
color:#99165c;
margin-bottom:8px;
}

.coinText{
text-align:center;
color:#80506d;
font-weight:900;
margin:7px 0;
}

.shopItem{
display:flex;
align-items:center;
justify-content:space-between;
background:#ffe8f3;
border-radius:16px;
padding:9px;
margin:7px 0;
color:#861550;
font-weight:900;
}

.itemLeft{
display:flex;
flex-direction:column;
}

.quantity{
font-size:12px;
color:#bd337b;
margin-top:3px;
}

.shopItem button{
padding:7px 9px;
}

.close{
width:100%;
margin-top:8px;
}

.levelGrid{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.levelGrid button{
width:50px;
margin:3px;
padding:8px 2px;
}

.rewardBox{
background:linear-gradient(135deg,#fff0a8,#ffd3ec);
border-radius:18px;
padding:12px;
margin:8px 0;
text-align:center;
}

.rewardTitle{
font-size:20px;
font-weight:1000;
color:#95155a;
}

.adReward{
width:100%;
margin-top:8px;
padding:11px;
background:linear-gradient(135deg,#ffe76b,#ff9dcc);
}

.adReward.used{
opacity:.45;
}

.adReward.cooldown{
opacity:.65;
background:linear-gradient(135deg,#ddd,#eee);
color:#666;
}

#dailyInfo{
font-size:13px;
color:#80506d;
font-weight:800;
margin-top:5px;
}

.cooldownText{
font-size:12px;
color:#9a4774;
font-weight:900;
margin-top:4px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="top">
<div class="title">🍬 CANDY BLAST 💥</div>

<div class="stats">
<span>LEVEL <b id="level">1</b></span>
<span>⭐ <b id="score">0</b></span>
<span>🪙 <b id="coins">100</b></span>
</div>

<div class="stats">
<span>🎯 <b id="moves">30</b></span>
<span>❤️ <b id="lives">5</b></span>
</div>
</div>

<div id="mode"></div>
<div id="message"></div>

<div id="panel">
<div class="panelTitle" id="panelTitle">🛒 SHOP</div>
<div id="panelContent"></div>
<button class="close" onclick="closePanel()">CLOSE</button>
</div>

<div id="bottom">

<button class="move" id="leftBtn">◀</button>
<button class="move" id="rightBtn">▶</button>

<div id="menuViewport">

<div id="menu">

<button onclick="openShop()">🛒 Shop</button>
<button onclick="openLevels()">📋 Levels</button>
<button onclick="dailyReward()">🎁 Daily</button>
<button onclick="newGame()">🔄 New</button>
<button onclick="useHammer()">🔨 Hammer</button>
<button onclick="useColorBomb()">🌈 Color</button>
<button onclick="useBomb()">💣 Bomb</button>
<button onclick="useShuffle()">🔀 Shuffle</button>

</div>
</div>

</div>

<script>

"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const COLS=7;
const ROWS=8;
const TYPES=6;
const MAX_LEVEL=200;

let W=0,H=0,cell=50,boardX=0,boardY=0;

let board=[];
let candies=[];
let particles=[];
let floating=[];

let score=0;
let coins=100;
let moves=30;
let level=1;
let lives=5;
let unlockedLevel=1;

let selected=null;
let pointerStart=null;
let busy=false;

let hammerMode=false;
let colorMode=false;
let bombMode=false;

let menuX=0;

/* =========================
   REWARDED ADS
   2 HOUR COOLDOWN
   ========================= */

const REWARDED_COOLDOWN=2*60*60*1000;

let pendingRewardIndex=null;

function getAdTime(index){

return parseInt(
localStorage.getItem("candyRewardTime_"+index)||"0"
);

}

function setAdTime(index){

localStorage.setItem(
"candyRewardTime_"+index,
String(Date.now())
);

}

function adReady(index){

return Date.now()-getAdTime(index)>=REWARDED_COOLDOWN;

}

function formatCooldown(index){

const remaining=
REWARDED_COOLDOWN-
(Date.now()-getAdTime(index));

if(remaining<=0)return "";

const totalSeconds=
Math.ceil(remaining/1000);

const hours=
Math.floor(totalSeconds/3600);

const minutes=
Math.floor((totalSeconds%3600)/60);

const seconds=
totalSeconds%60;

return "⏳ Available in "+
String(hours).padStart(2,"0")+":"+
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

}

/* BOOSTERS */

let boosters={
hammer:1,
color:1,
bomb:1,
shuffle:2
};

const colors=[
"#f04444",
"#ffd52f",
"#388cff",
"#a64cf4",
"#ff9824",
"#36d66c"
];

/* SOUND */

let audioCtx=null;

function startAudio(){

if(!audioCtx){

const AC=
window.AudioContext||
window.webkitAudioContext;

if(AC)audioCtx=new AC();

}

if(audioCtx&&audioCtx.state==="suspended")
audioCtx.resume();

}

function sound(
frequency=440,
duration=.08,
type="sine",
volume=.06
){

try{

startAudio();

if(!audioCtx)return;

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.type=type;
osc.frequency.value=frequency;

gain.gain.setValueAtTime(
volume,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audioCtx.currentTime+duration
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(audioCtx.currentTime+duration);

}catch(e){}

}

function matchSound(){

sound(520,.07);

setTimeout(
()=>sound(700,.08),
45
);

}

function bombSound(){

sound(100,.18,"sawtooth",.1);

setTimeout(
()=>sound(60,.22,"square",.07),
70
);

}

function buySound(){

sound(650,.07);

setTimeout(
()=>sound(900,.1),
70
);

}

document.addEventListener(
"pointerdown",
startAudio
);

/* SAVE */

function save(){

try{

localStorage.setItem(
"candyBlastSave",
JSON.stringify({
coins,
level,
lives,
unlockedLevel,
boosters
})
);

}catch(e){}

}

function load(){

try{

const raw=
localStorage.getItem("candyBlastSave");

if(!raw)return;

const d=JSON.parse(raw);

coins=d.coins??100;
level=d.level??1;
lives=d.lives??5;
unlockedLevel=d.unlockedLevel??1;

if(d.boosters)
boosters=d.boosters;

}catch(e){}

}

/* RESIZE */

function resize(){

const dpr=
Math.min(window.devicePixelRatio||1,2);

W=innerWidth;
H=innerHeight;

canvas.width=W*dpr;
canvas.height=H*dpr;

canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(
dpr,0,0,dpr,0,0
);

cell=Math.min(
(W-24)/COLS,
55
);

boardX=
(W-COLS*cell)/2;

boardY=
Math.max(
150,
(H-ROWS*cell)/2-10
);

for(const c of candies)
c.setTarget();

}

window.addEventListener(
"resize",
resize
);

/* CANDY */

class Candy{

constructor(type,col,row){

this.type=type;
this.col=col;
this.row=row;

this.x=0;
this.y=0;

this.targetX=0;
this.targetY=0;

this.scale=1;
this.alpha=1;
this.special=null;

this.setTarget();

this.x=this.targetX;
this.y=this.targetY;

}

setTarget(){

this.targetX=
boardX+
this.col*cell+
cell/2;

this.targetY=
boardY+
this.row*cell+
cell/2;

}

update(){

this.x+=
(this.targetX-this.x)*.25;

this.y+=
(this.targetY-this.y)*.25;

this.scale+=
(1-this.scale)*.18;

}

draw(){

if(this.alpha<=0)return;

ctx.save();

ctx.globalAlpha=this.alpha;

ctx.translate(
this.x,
this.y
);

ctx.scale(
this.scale,
this.scale
);

const r=cell*.34;

ctx.beginPath();

ctx.ellipse(
3,6,
r*.95,
r*.52,
0,0,Math.PI*2
);

ctx.fillStyle=
"rgba(0,0,0,.22)";

ctx.fill();

ctx.beginPath();

ctx.arc(
0,0,
r+3,
0,Math.PI*2
);

ctx.fillStyle=
"rgba(255,255,255,.35)";

ctx.fill();

const g=
ctx.createRadialGradient(
-r*.35,-r*.4,1,
r*.2,r*.2,r*1.25
);

g.addColorStop(
0,
"#fff"
);

g.addColorStop(
.15,
light(colors[this.type],.25)
);

g.addColorStop(
.55,
colors[this.type]
);

g.addColorStop(
1,
dark(colors[this.type],.2)
);

ctx.beginPath();

ctx.arc(
0,0,
r,
0,Math.PI*2
);

ctx.fillStyle=g;
ctx.fill();

ctx.beginPath();

ctx.ellipse(
-r*.3,-r*.38,
r*.23,r*.12,
-.5,0,Math.PI*2
);

ctx.fillStyle=
"rgba(255,255,255,.85)";

ctx.fill();

if(this.special==="horizontal"){

ctx.strokeStyle="#fff";
ctx.lineWidth=6;

ctx.beginPath();

ctx.moveTo(-r,-2);
ctx.lineTo(r,2);

ctx.stroke();

sparkle(r);

}

if(this.special==="vertical"){

ctx.strokeStyle="#fff";
ctx.lineWidth=6;

ctx.beginPath();

ctx.moveTo(-2,-r);
ctx.lineTo(2,r);

ctx.stroke();

sparkle(r);

}

if(this.special==="color"){

ctx.fillStyle="#222";

ctx.beginPath();

ctx.arc(
0,0,
r*.72,
0,Math.PI*2
);

ctx.fill();

const dots=[
"#ff3030",
"#ffe12d",
"#45df63",
"#36a9ff",
"#ff7a24"
];

for(let i=0;i<8;i++){

const a=
i*Math.PI*2/8;

ctx.fillStyle=
dots[i%5];

ctx.beginPath();

ctx.arc(
Math.cos(a)*r*.48,
Math.sin(a)*r*.48,
r*.09,
0,Math.PI*2
);

ctx.fill();

}

}

if(this.special==="bomb"){

ctx.fillStyle="#252525";

ctx.beginPath();

ctx.arc(
0,0,
r*.72,
0,Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#fff";
ctx.lineWidth=3;

ctx.beginPath();

ctx.moveTo(
-r*.35,
-r*.35
);

ctx.lineTo(
r*.35,
r*.35
);

ctx.moveTo(
r*.35,
-r*.35
);

ctx.lineTo(
-r*.35,
r*.35
);

ctx.stroke();

}

ctx.restore();

}

}

function light(hex,a){

const r=
parseInt(hex.slice(1,3),16);

const g=
parseInt(hex.slice(3,5),16);

const b=
parseInt(hex.slice(5,7),16);

return `rgb(
${Math.round(r+(255-r)*a)},
${Math.round(g+(255-g)*a)},
${Math.round(b+(255-b)*a)}
)`;

}

function dark(hex,a){

const r=
parseInt(hex.slice(1,3),16);

const g=
parseInt(hex.slice(3,5),16);

const b=
parseInt(hex.slice(5,7),16);

return `rgb(
${Math.round(r*(1-a))},
${Math.round(g*(1-a))},
${Math.round(b*(1-a))}
)`;

}

function sparkle(r){

ctx.fillStyle="#fff";

for(let i=0;i<4;i++){

const a=i*Math.PI/2;

ctx.beginPath();

ctx.arc(
Math.cos(a)*r*.55,
Math.sin(a)*r*.55,
2.5,
0,Math.PI*2
);

ctx.fill();

}

}

/* BOARD */

function createBoard(){

board=[];
candies=[];

for(let r=0;r<ROWS;r++){

board[r]=[];

for(let c=0;c<COLS;c++){

let type;

do{

type=
Math.floor(
Math.random()*TYPES
);

}while(

(c>=2&&
board[r][c-1]===type&&
board[r][c-2]===type)

||

(r>=2&&
board[r-1][c]===type&&
board[r-2][c]===type)

);

board[r][c]=type;

candies.push(
new Candy(type,c,r)
);

}

}

}

function getCandy(r,c){

return candies.find(
x=>x.row===r&&x.col===c
)||null;

}

/* MATCH */

function findMatches(){

const found=new Set();

for(let r=0;r<ROWS;r++){

let c=0;

while(c<COLS){

const type=board[r][c];

if(type<0){

c++;
continue;

}

let end=c+1;

while(
end<COLS&&
board[r][end]===type
)
end++;

if(end-c>=3){

for(
let x=c;
x<end;
x++
)
found.add(r+","+x);

}

c=end;

}

}

for(let c=0;c<COLS;c++){

let r=0;

while(r<ROWS){

const type=board[r][c];

if(type<0){

r++;
continue;

}

let end=r+1;

while(
end<ROWS&&
board[end][c]===type
)
end++;

if(end-r>=3){

for(
let x=r;
x<end;
x++
)
found.add(x+","+c);

}

r=end;

}

}

return [...found].map(v=>{

const a=
v.split(",").map(Number);

return{
r:a[0],
c:a[1]
};

});

}

/* LEVEL */

function levelData(){

return{

moves:Math.max(
18,
30-Math.floor((level-1)/15)
),

target:
700+level*180

};

}

function startLevel(lvl){

level=
Math.max(
1,
Math.min(MAX_LEVEL,lvl)
);

const data=levelData();

moves=data.moves;
score=0;

selected=null;
busy=false;

createBoard();

updateUI();
save();

showMessage(
"LEVEL "+level
);

}

/* SWAP */

async function swap(a,b){

if(busy||moves<=0)return;

if(
Math.abs(a.c-b.c)+
Math.abs(a.r-b.r)!==1
)
return;

const ca=getCandy(a.r,a.c);
const cb=getCandy(b.r,b.c);

if(!ca||!cb)return;

busy=true;

sound(300,.08);

board[a.r][a.c]=cb.type;
board[b.r][b.c]=ca.type;

ca.col=b.c;
ca.row=b.r;

cb.col=a.c;
cb.row=a.r;

ca.setTarget();
cb.setTarget();

await wait(180);

const matches=findMatches();

if(!matches.length){

board[a.r][a.c]=ca.type;
board[b.r][b.c]=cb.type;

ca.col=a.c;
ca.row=a.r;

cb.col=b.c;
cb.row=b.r;

ca.setTarget();
cb.setTarget();

await wait(130);

busy=false;

return;

}

moves--;

updateUI();

await resolveMatches();

busy=false;

}

/* MATCH RESOLVE */

async function resolveMatches(){

let combo=0;

while(true){

const matches=findMatches();

if(!matches.length)
break;

combo++;

const points=
matches.length*
20*
combo;

score+=points;

coins+=
Math.floor(matches.length/3);

matchSound();

addFloating(
W/2,
boardY+ROWS*cell*.45,
"+"+points
);

for(const m of matches){

const candy=
getCandy(m.r,m.c);

if(candy){

burst(
candy.x,
candy.y,
colors[candy.type],
14
);

candy.alpha=0;

}

board[m.r][m.c]=-1;

}

await wait(180);

candies=
candies.filter(
c=>c.alpha>0
);

collapse();

await wait(180);

refill();

await wait(260);

updateUI();

}

if(combo>=2){

showMessage(
"COMBO ×"+combo
);

sound(800,.12);

}

checkLevel();
save();

}

/* COLLAPSE */

function collapse(){

for(let c=0;c<COLS;c++){

let write=ROWS-1;

for(
let r=ROWS-1;
r>=0;
r--
){

if(board[r][c]>=0){

board[write][c]=
board[r][c];

if(write!==r)
board[r][c]=-1;

write--;

}

}

}

for(const candy of candies){

if(
board[candy.row][candy.col]===-1
){

let nr=candy.row;

while(
nr+1<ROWS&&
board[nr+1][candy.col]===-1
)
nr++;

if(nr!==candy.row){

board[nr][candy.col]=
candy.type;

board[candy.row][candy.col]=-1;

candy.row=nr;

candy.setTarget();

}

}

}

}

/* REFILL */

function refill(){

for(let c=0;c<COLS;c++){

for(let r=0;r<ROWS;r++){

if(board[r][c]===-1){

const type=
Math.floor(
Math.random()*TYPES
);

board[r][c]=type;

const candy=
new Candy(type,c,r);

candy.y=
boardY-cell*2;

candy.scale=.65;

candies.push(candy);

}

}

}

}

/* LEVEL COMPLETE */

function checkLevel(){

if(
score<levelData().target
)
return;

coins+=25;

if(level<MAX_LEVEL){

unlockedLevel=
Math.max(
unlockedLevel,
level+1
);

}

save();

setTimeout(
openComplete,
300
);

}

function openComplete(){

busy=true;

document.getElementById(
"panelTitle"
).textContent=
"🎉 LEVEL COMPLETE!";

document.getElementById(
"panelContent"
).innerHTML=`

<div style="
text-align:center;
font-size:42px;
margin:10px;
">
⭐⭐⭐
</div>

<div class="coinText">
LEVEL ${level} COMPLETE
</div>

<div class="coinText">
🪙 +25 COINS
</div>

<button
style="width:100%;margin-top:8px"
onclick="nextLevel()">

▶ NEXT LEVEL

</button>
`;

document.getElementById(
"panel"
).classList.add("open");

}

function nextLevel(){

closePanel();

if(level<MAX_LEVEL){

startLevel(level+1);

}else{

busy=false;

showMessage(
"🏆 ALL LEVELS!"
);

}

}

/* WAIT */

function wait(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}

/* BOOSTERS */

function useHammer(){

if(boosters.hammer<=0){

showMessage(
"🔨 NO HAMMER"
);

return;

}

closePanel();

hammerMode=true;
colorMode=false;
bombMode=false;

showMode(
"🔨 TAP A CANDY"
);

}

function useColorBomb(){

if(boosters.color<=0){

showMessage(
"🌈 NO COLOR BOMB"
);

/* BOOSTER TAP */

async function boosterTap(r,c){

if(!board[r]||
board[r][c]<0)
return;

/* HAMMER */

if(hammerMode){

boosters.hammer--;

const candy=
getCandy(r,c);

if(candy){

burst(
candy.x,
candy.y,
"#fff",
28
);

candy.alpha=0;

}

board[r][c]=-1;

hammerMode=false;
hideMode();

sound(
180,
.16,
"square",
.09
);

await wait(180);

candies=
candies.filter(
c=>c.alpha>0
);

collapse();
refill();

updateUI();
save();

return;

}

/* COLOR */

if(colorMode){

const type=board[r][c];

boosters.color--;

let count=0;

for(let rr=0;rr<ROWS;rr++){

for(let cc=0;cc<COLS;cc++){

if(board[rr][cc]===type){

const candy=
getCandy(rr,cc);

if(candy){

burst(
candy.x,
candy.y,
colors[type],
16
);

candy.alpha=0;

}

board[rr][cc]=-1;

count++;

}

}

}

score+=count*40;

colorMode=false;
hideMode();

sound(
950,
.2,
"sine",
.1
);

await wait(300);

candies=
candies.filter(
c=>c.alpha>0
);

collapse();
refill();

updateUI();
save();

return;

}

/* 5x5 BOMB */

if(bombMode){

boosters.bomb--;

bombSound();

const centerX=
boardX+
c*cell+
cell/2;

const centerY=
boardY+
r*cell+
cell/2;

/* EXACT 5x5 */

for(
let rr=Math.max(0,r-2);
rr<=Math.min(ROWS-1,r+2);
rr++
){

for(
let cc=Math.max(0,c-2);
cc<=Math.min(COLS-1,c+2);
cc++
){

const candy=
getCandy(rr,cc);

if(candy){

burst(
candy.x,
candy.y,
colors[candy.type],
20
);

candy.alpha=0;

}

board[rr][cc]=-1;

}

}

/* BIG EXPLOSION */

for(let i=0;i<90;i++){

const a=
Math.random()*Math.PI*2;

const speed=
2+Math.random()*6;

particles.push({

x:centerX,
y:centerY,

vx:Math.cos(a)*speed,
vy:Math.sin(a)*speed,

life:1.3,
size:2+Math.random()*6,

color:
i%2?
"#fff":
"#ffd52f"

});

}

particles.push({

shock:true,
x:centerX,
y:centerY,
radius:5,
life:1

});

score+=250;

bombMode=false;
hideMode();

await wait(450);

candies=
candies.filter(
c=>c.alpha>0
);

collapse();
refill();

updateUI();
save();

showMessage(
"💥 5×5 BLAST!"
);

}

}

String(d.getMonth()+1)
.padStart(2,"0")+"-"+
String(d.getDate())
.padStart(2,"0");

}

/* =========================
   REWARDED AD
   ========================= */

function watchRewardedAd(index){

if(!adReady(index)){

showMessage(
"⏳ AD NOT READY"
);

return;

}

pendingRewardIndex=index;

/*
REAL NATIVE REWARDED AD BRIDGE
*/

if(
window.Android &&
typeof window.Android.showRewardedAd==="function"
){

window.Android.showRewardedAd();

}

else if(
window.AndroidInterface &&
typeof window.AndroidInterface.showRewardedAd==="function"
){

window.AndroidInterface.showRewardedAd();

}

else{

pendingRewardIndex=null;

showMessage(
"📺 AD NOT CONNECTED"
);

}

}

/*
The APK/native side should call this
ONLY AFTER the real rewarded ad
has been completed.
*/

function rewardAdCompleted(){

const index=
Number.isInteger(
pendingRewardIndex
)
?
pendingRewardIndex
:
-1;

if(index<0){

return;

}

if(!adReady(index)){

pendingRewardIndex=null;

return;

}

/* 2-hour cooldown */

setAdTime(index);

/* +50 reward */

coins+=50;

save();
updateUI();

buySound();

showMessage(
"📺 +50 COINS"
);

pendingRewardIndex=null;

dailyReward();

}

/* Make callback available */

window.rewardAdCompleted=
rewardAdCompleted;

window.watchRewardedAd=
watchRewardedAd;

/* INPUT */

canvas.addEventListener(
"pointerdown",
e=>{

if(busy)return;

startAudio();

const p=
getCell(
e.clientX,
e.clientY
);

if(!p)return;

pointerStart={
x:e.clientX,
y:e.clientY,
cell:p
};

});

canvas.addEventListener(
"pointerup",
async e=>{

if(
busy||
!pointerStart
){

pointerStart=null;

return;

}

const start=
pointerStart.cell;

const dx=
e.clientX-
pointerStart.x;

const dy=
e.clientY-
pointerStart.y;

pointerStart=null;

if(
Math.abs(dx)<18&&
Math.abs(dy)<18
){

if(
hammerMode||
colorMode||
bombMode
){

await boosterTap(
start.r,
start.c
);

return;

}

selected=start;

return;

}

if(
hammerMode||
colorMode||
bombMode
)
return;

const end={
r:start.r,
c:start.c
};

if(
Math.abs(dx)>
Math.abs(dy)
){

end.c+=
dx>0?1:-1;

}else{

end.r+=
dy>0?1:-1;

}

if(
end.r>=0&&
end.r<ROWS&&
end.c>=0&&
end.c<COLS
){

selected=null;

swap(start,end);

}

});

function getCell(x,y){

const c=
Math.floor(
(x-boardX)/cell
);

const r=
Math.floor(
(y-boardY)/cell
);

if(
c<0||
c>=COLS||
r<0||
r>=ROWS
)
return null;

return{r,c};

}

/* PARTICLES */

function burst(
x,y,color,count
){

for(let i=0;i<count;i++){

const a=
Math.random()*Math.PI*2;

const speed=
1.5+Math.random()*4;

particles.push({

x,y,

vx:
Math.cos(a)*speed,

vy:
Math.sin(a)*speed,

life:1,

size:
2+Math.random()*4,

color

});

}

}

function drawParticles(){

for(
let i=particles.length-1;
i>=0;
i--
){

const p=particles[i];

if(p.shock){

p.radius+=8;
p.life-=.045;

ctx.globalAlpha=p.life;

ctx.strokeStyle="#fff";
ctx.lineWidth=
6*p.life;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.radius,
0,
Math.PI*2
);

ctx.stroke();

if(p.life<=0)
particles.splice(i,1);

continue;

}

p.x+=p.vx;
p.y+=p.vy;

p.vy+=.06;

p.life-=.035;

if(p.life<=0){

particles.splice(i,1);

continue;

}

ctx.globalAlpha=p.life;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

ctx.fillStyle=p.color;

ctx.fill();

}

ctx.globalAlpha=1;

}

/* FLOATING */

function addFloating(
x,y,text
){

floating.push({
x,y,text,life:1
});

}

function drawFloating(){

ctx.textAlign="center";
ctx.font="900 24px Arial";

for(
let i=floating.length-1;
i>=0;
i--
){

const f=floating[i];

f.y-=.8;
f.life-=.025;

if(f.life<=0){

floating.splice(i,1);

continue;

}

ctx.globalAlpha=f.life;

ctx.lineWidth=5;
ctx.strokeStyle="#9d1b61";

ctx.strokeText(
f.text,
f.x,
f.y
);

ctx.fillStyle="#fff";

ctx.fillText(
f.text,
f.x,
f.y
);

}

ctx.globalAlpha=1;

}

/* BACKGROUND */

function drawBackground(){

const g=
ctx.createLinearGradient(
0,0,0,H
);

g.addColorStop(
0,
"#dff7ff"
);

g.addColorStop(
.55,
"#c8efff"
);

g.addColorStop(
1,
"#fff0c4"
);

ctx.fillStyle=g;

ctx.fillRect(
0,0,W,H
);

ctx.fillStyle=
"rgba(255,255,255,.4)";

for(let i=0;i<5;i++){

const x=
(i*170+40)%W;

const y=
140+(i%3)*100;

ctx.beginPath();

ctx.arc(
x,y,25,
0,Math.PI*2
);

ctx.arc(
x+30,y-10,34,
0,Math.PI*2
);

ctx.arc(
x+60,y,24,
0,Math.PI*2
);

ctx.fill();

}

}

/* ROUNDED */

function rounded(
x,y,w,h,r,color
){

ctx.beginPath();

ctx.roundRect(
x,y,w,h,r
);

ctx.fillStyle=color;
ctx.fill();

}

/* BOARD */

function drawBoard(){

const bw=COLS*cell;
const bh=ROWS*cell;

rounded(
boardX-9,
boardY-9,
bw+18,
bh+18,
24,
"rgba(30,50,100,.25)"
);

rounded(
boardX,
boardY,
bw,
bh,
20,
"#6c8cbd"
);

for(
let r=0;
r<ROWS;
r++
){

for(
let c=0;
c<COLS;
c++
){

rounded(
boardX+c*cell+3,
boardY+r*cell+3,
cell-6,
cell-6,
10,
"rgba(30,55,100,.2)"
);

}

}

}

/* SELECTION */

function drawSelection(){

if(!selected)return;

const x=
boardX+
selected.c*cell+
cell/2;

const y=
boardY+
selected.r*cell+
cell/2;

const pulse=
1+
Math.sin(
performance.now()/100
)*.05;

ctx.save();

ctx.translate(x,y);
ctx.scale(pulse,pulse);

ctx.strokeStyle="#fff";
ctx.lineWidth=4;

ctx.beginPath();

ctx.arc(
0,
0,
cell*.43,
0,
Math.PI*2
);

ctx.stroke();

ctx.restore();

}

/* DRAW */

function draw(){

drawBackground();
drawBoard();

for(
const candy of candies
){

candy.update();
candy.draw();

}

drawSelection();
drawParticles();
drawFloating();

}

/* LOOP */

function loop(){

draw();

requestAnimationFrame(loop);

}

/* START */

load();
resize();
startLevel(level);
loop();

document.getElementById(

</script>
